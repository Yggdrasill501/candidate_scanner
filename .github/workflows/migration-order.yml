name: migration-order

on:
  pull_request:
    paths: ["packages/db/migrations/**"]

jobs:
  order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Migrations apply in filename order. A new one that sorts before the base
      # branch's newest would apply out of order, or not at all.
      - name: New migrations sort after the base branch's newest
        run: |
          dir=packages/db/migrations
          base="origin/${{ github.base_ref }}"
          newest=$(git ls-tree -r --name-only "$base" -- $dir/ | grep -E '\.ts$' | sort | tail -1 | xargs -r basename)
          added=$(git diff --name-only --diff-filter=A "$base"...HEAD -- $dir/ | grep -E '\.ts$' || true)
          status=0
          for f in $added; do
            name=$(basename "$f")
            if [ -n "$newest" ] && [ "$name" \< "$newest" ]; then
              echo "::error file=$f::$name sorts before $newest on ${{ github.base_ref }}. Rename it with a later timestamp."
              status=1
            fi
          done
          exit $status
